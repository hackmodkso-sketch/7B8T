<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Admin & Bot Edition</title>
    <style>
        body {
            margin: 0;
            background: #1e1f22;
            color: #dbdee1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: stretch;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Admin Sidebar Layout */
        #admin-sidebar {
            width: 280px;
            background: #2b2d31;
            border-right: 2px solid #111214;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 5px 0 15px rgba(0,0,0,0.2);
        }

        h2, h3 {
            margin: 0;
            color: #fff;
            letter-spacing: 0.5px;
        }

        h2 { border-bottom: 2px solid #35373c; padding-bottom: 10px; font-size: 20px; }
        h3 { font-size: 14px; text-transform: uppercase; color: #949ba4; }

        .admin-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #313338;
            padding: 12px;
            border-radius: 6px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
        }

        select, button {
            background: #1e1f22;
            color: #fff;
            border: 1px solid #4e5058;
            padding: 8px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
        }

        select:focus { border-color: #5865f2; }

        button.primary {
            background: #5865f2;
            border: none;
            font-weight: bold;
        }
        button.primary:hover { background: #4752c4; }
        
        button.danger {
            background: #da373c;
            border: none;
            font-weight: bold;
        }
        button.danger:hover { background: #a92b2f; }

        .stat-line {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            padding: 4px 0;
            border-bottom: 1px solid #3f4147;
        }
        .stat-line:last-child { border: none; }

        /* Bot Console Terminal */
        #bot-terminal {
            background: #111214;
            color: #23a55a;
            font-family: monospace;
            font-size: 12px;
            padding: 8px;
            border-radius: 4px;
            height: 60px;
            overflow-y: auto;
            border: 1px solid #23272a;
        }

        /* Main Game Arena */
        #game-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1e1f22;
            position: relative;
        }

        #status {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 24px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            transition: color 0.3s ease;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 110px);
            grid-template-rows: repeat(3, 110px);
            gap: 12px;
            background: #2b2d31;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.4);
            transition: border 0.3s ease, box-shadow 0.3s ease;
            border: 2px solid transparent;
        }

        /* Impossible Mode Aggressive Glow */
        .board.impossible-rage {
            border-color: #f23f43;
            box-shadow: 0 0 25px rgba(242, 63, 67, 0.4);
        }

        .cell {
            background: #313338;
            border: none;
            border-radius: 8px;
            font-size: 48px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s, color 0.2s;
        }

        .cell:hover { background: #35373c; }
        .cell:active { transform: scale(0.96); }

        .cell.X { color: #5865f2; text-shadow: 0 0 15px rgba(88,101,242,0.4); }
        .cell.O { color: #f23f43; text-shadow: 0 0 15px rgba(242,63,67,0.4); }
    </style>
</head>
<body>

    <!-- ADMINISTRATION SIDEBAR PANEL -->
    <div id="admin-sidebar">
        <h2>Admin Dashboard</h2>
        
        <!-- Match Setup Mode -->
        <div class="admin-section">
            <h3>Game Mode</h3>
            <label for="gameMode">Opponent Type:</label>
            <select id="gameMode">
                <option value="bot">AI Bot (vs Computer)</option>
                <option value="local">Local 2 Players</option>
            </select>
            
            <label for="botDifficulty" id="diff-label">Bot Intelligence:</label>
            <select id="botDifficulty">
                <option value="easy">Easy (Random moves)</option>
                <option value="medium">Medium (Blocks wins)</option>
                <option value="unbeatable">Hard (Standard AI)</option>
                <option value="impossible">🔴 IMPOSSIBLE MODE</option>
            </select>
        </div>

        <!-- Bot Live Output Logs -->
        <div class="admin-section" id="terminal-section">
            <h3>Bot Core Logs</h3>
            <div id="bot-terminal">> System ready.</div>
        </div>

        <!-- Real-time Stats Tracker -->
        <div class="admin-section">
            <h3>Server Statistics</h3>
            <div class="stat-line"><span>Player X Wins:</span><span id="stat-x">0</span></div>
            <div class="stat-line"><span>Player O / Bot:</span><span id="stat-o">0</span></div>
            <div class="stat-line"><span>Ties/Draws:</span><span id="stat-ties">0</span></div>
        </div>

        <!-- Administrative Controls -->
        <div class="admin-section" style="margin-top: auto;">
            <h3>System Controls</h3>
            <button id="btn-reset" class="primary">Clear Board</button>
            <button id="btn-wipe" class="danger">Reset All Stats</button>
        </div>
    </div>

    <!-- MAIN GAME FIELD INTERFACE -->
    <div id="game-container">
        <div id="status">Your Turn (X)</div>

        <div class="board" id="board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>
    </div>

    <script>
        const boardElement = document.getElementById("board");
        const statusElement = document.getElementById("status");
        const modeSelect = document.getElementById("gameMode");
        const diffSelect = document.getElementById("botDifficulty");
        const diffLabel = document.getElementById("diff-label");
        const terminalElement = document.getElementById("bot-terminal");
        const cells = document.querySelectorAll(".cell");
        
        // Buttons
        document.getElementById("btn-reset").addEventListener("click", resetBoard);
        document.getElementById("btn-wipe").addEventListener("click", wipeAllStats);
        modeSelect.addEventListener("change", handleModeChange);
        diffSelect.addEventListener("change", handleDifficultyChange);

        // Core App Memory State
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let isGameActive = true;
        
        let stats = { x: 0, o: 0, ties: 0 };

        const winPatterns = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Horizontals
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Verticals
            [0, 4, 8], [2, 4, 6]             // Diagonals
        ];

        const trashTalk = [
            "Calculating your loss...",
            "A chess grandmaster couldn't win this.",
            "Why do you even try?",
            "Analyzing flawed human matrix...",
            "This match was over before it started."
        ];

        function logToTerminal(text, color = "#23a55a") {
            terminalElement.style.color = color;
            terminalElement.innerText = `> ${text}`;
        }

        function handleCellClick(e) {
            const index = parseInt(e.target.getAttribute("data-index"));

            if (board[index] !== "" || !isGameActive || (currentPlayer === "O" && modeSelect.value === "bot")) {
                return;
            }

            makeMove(index, "X");
            
            if (isGameActive && modeSelect.value === "bot") {
                if (diffSelect.value === "impossible") {
                    statusElement.innerText = "⚡ BOT IS SIMULATING 10,000 OUTCOMES...";
                    statusElement.style.color = "#f23f43";
                } else {
                    statusElement.innerText = "Bot is calculating...";
                }
                setTimeout(triggerBotMove, diffSelect.value === "impossible" ? 250 : 400); 
            }
        }

        function makeMove(index, player) {
            board[index] = player;
            cells[index].innerText = player;
            cells[index].classList.add(player);
            
            if (checkWin(board, player)) {
                if (modeSelect.value === "bot" && player === "O") {
                    statusElement.innerText = diffSelect.value === "impossible" ? "💀 DEFEAT. ENTERING IDLE MODE." : "Bot Wins!";
                    logToTerminal("EASY WIN. TRY LOWERING THE DIFFICULTY.", "#da373c");
                } else {
                    statusElement.innerText = `Player ${player} Wins!`;
                    logToTerminal("ERROR: Human bypass detected.");
                }
                stats[player.toLowerCase()]++;
                updateStatsUI();
                isGameActive = false;
                boardElement.classList.remove("impossible-rage");
                return;
            }

            if (!board.includes("")) {
                statusElement.innerText = "Tie Match!";
                logToTerminal("TIE DETECTED. OPTIMAL OUTCOME SECURED.", "#faa61a");
                stats.ties++;
                updateStatsUI();
                isGameActive = false;
                boardElement.classList.remove("impossible-rage");
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";
            if (modeSelect.value === "bot") {
                statusElement.innerText = "Your Turn (X)";
                statusElement.style.color = "#fff";
            } else {
                statusElement.innerText = `Player ${currentPlayer}'s Turn`;
            }
        }

        /* --- BOT AI LOGIC MODULE --- */
        function triggerBotMove() {
            if (!isGameActive) return;
            const difficulty = diffSelect.value;
            let targetIndex;

            if (difficulty === "easy") {
                logToTerminal("Picking random matrix index...");
                targetIndex = getRandomMove();
            } else if (difficulty === "medium") {
                logToTerminal("Scanning for immediate threats...");
                targetIndex = getMediumMove();
            } else {
                // Hard & Impossible Mode both invoke the perfect predictive algorithm tree
                if (difficulty === "impossible") {
                    const insult = trashTalk[Math.floor(Math.random() * trashTalk.length)];
                    logToTerminal(insult, "#f23f43");
                } else {
                    logToTerminal("Running Minimax calculations...");
                }

                let bestScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (board[i] === "") {
                        board[i] = "O";
                        let score = minimax(board, 0, false);
                        board[i] = "";
                        if (score > bestScore) {
                            bestScore = score;
                            targetIndex = i;
                        }
                    }
                }
            }

            if (targetIndex !== undefined && targetIndex !== -1) {
                makeMove(targetIndex, "O");
            }
        }

        function getRandomMove() {
            let empties = board.map((val, idx) => val === "" ? idx : null).filter(val => val !== null);
            return empties[Math.floor(Math.random() * empties.length)];
        }

        function getMediumMove() {
            for(let i=0; i<9; i++) {
                if(board[i] === "") {
                    board[i] = "O";
                    if(checkWin(board, "O")) { board[i] = ""; return i; }
                    board[i] = "";
                }
            }
            for(let i=0; i<9; i++) {
                if(board[i] === "") {
                    board[i] = "X";
                    if(checkWin(board, "X")) { board[i] = ""; return i; }
                    board[i] = "";
                }
            }
            return getRandomMove();
        }

        function minimax(tempBoard, depth, isMaximizing) {
            if (checkWin(tempBoard, "O")) return 10 - depth;
            if (checkWin(tempBoard, "X")) return depth - 10;
            if (!tempBoard.includes("")) return 0;

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (tempBoard[i] === "") {
                        tempBoard[i] = "O";
                        let score = minimax(tempBoard, depth + 1, false);
                        tempBoard[i] = "";
                        bestScore = Math.max(score, bestScore);
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (tempBoard[i] === "") {
                        tempBoard[i] = "X";
                        let score = minimax(tempBoard, depth + 1, true);
                        tempBoard[i] = "";
                        bestScore = Math.min(score, bestScore);
                    }
                }
                return bestScore;
            }
        }

        function checkWin(b, player) {
            return winPatterns.some(pattern => {
                return pattern.every(index => b[index] === player);
            });
        }

        /* --- CONTROL FUNCTIONS --- */
        function handleModeChange() {
            if (modeSelect.value === "local") {
                diffSelect.style.display = "none";
                diffLabel.style.display = "none";
                document.getElementById("terminal-section").style.display = "none";
                boardElement.classList.remove("impossible-rage");
            } else {
                diffSelect.style.display = "block";
                diffLabel.style.display = "block";
                document.getElementById("terminal-section").style.display = "flex";
                handleDifficultyChange();
            }
            resetBoard();
        }

        function handleDifficultyChange() {
            if (diffSelect.value === "impossible" && modeSelect.value === "bot") {
                boardElement.classList.add("impossible-rage");
                logToTerminal("WARNING: IMPOSSIBLE INTERFACE ENGAGED.", "#f23f43");
            } else {
                boardElement.classList.remove("impossible-rage");
                logToTerminal("System ready.");
            }
            resetBoard();
        }

        function updateStatsUI() {
            document.getElementById("stat-x").innerText = stats.x;
            document.getElementById("stat-o").innerText = stats.o;
            document.getElementById("stat-ties").innerText = stats.ties;
        }

        function resetBoard() {
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            isGameActive = true;
            statusElement.innerText = "Your Turn (X)";
            statusElement.style.color = "#fff";
            cells.forEach(cell => {
                cell.innerText = "";
                cell.classList.remove("X", "O");
            });
            if (diffSelect.value === "impossible" && modeSelect.value === "bot") {
                logToTerminal("AWAITING INEVITABLE HUMAN ERROR...", "#f23f43");
            }
        }

        function wipeAllStats() {
            stats = { x: 0, o: 0, ties: 0 };
            updateStatsUI();
            resetBoard();
        }

        boardElement.addEventListener("click", handleCellClick);
    </script>
</body>
</html>
