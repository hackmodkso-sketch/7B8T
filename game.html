<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5-Level Platformer Quest</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #ui {
            width: 800px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        canvas {
            background: #23272a;
            border: 4px solid #5865F2;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 4px;
        }
        .controls-hint {
            margin-top: 15px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div id="lives-display">Lives: 3</div>
        <div id="level-display">Level: 1/5</div>
        <div id="items-display">Gems: 0</div>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div class="controls-hint">
        Use <strong>A / D</strong> or <strong>Arrow Keys</strong> to Move. Press <strong>W</strong>, <strong>Space</strong>, or <strong>Up Arrow</strong> to Jump.
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Game State
        let currentLevel = 1;
        const maxLevels = 5;
        let lives = 3;
        let score = 0;
        let gameOver = false;
        let gameWon = false;

        // Input Handling
        const keys = {};
        window.addEventListener("keydown", e => keys[e.code] = true);
        window.addEventListener("keyup", e => keys[e.code] = false);

        // Player Object
        const player = {
            x: 50,
            y: 400,
            width: 24,
            height: 32,
            vx: 0,
            vy: 0,
            speed: 5,
            gravity: 0.5,
            jumpForce: -11,
            grounded: false
        };

        // Level Definitions
        // P = Platform, I = Item (Gem), E = Enemy, D = Door (Next Level)
        const levels = {
            1: {
                platforms: [{x:0, y:460, w:800, h:40}, {x:200, y:360, w:120, h:20}, {x:400, y:280, w:150, h:20}, {x:620, y:200, w:100, h:20}],
                items: [{x:250, y:320}, {x:470, y:240}, {x:660, y:160}],
                enemies: [{x:350, y:430, start:300, end:500, vx:2}],
                door: {x:740, y:410, w:30, h:50}
            },
            2: {
                platforms: [{x:0, y:460, w:800, h:40}, {x:100, y:370, w:80, h:20}, {x:250, y:300, w:80, h:20}, {x:400, y:230, w:80, h:20}, {x:550, y:300, w:80, h:20}, {x:680, y:380, w:80, h:20}],
                items: [{x:130, y:330}, {x:280, y:260}, {x:430, y:190}, {x:580, y:260}],
                enemies: [{x:200, y:430, start:50, end:400, vx:3}, {x:450, y:430, start:410, end:750, vx:-3}],
                door: {x:710, y:330, w:30, h:50}
            },
            3: {
                platforms: [{x:0, y:460, w:150, h:40}, {x:220, y:380, w:120, h:20}, {x:400, y:300, w:120, h:20}, {x:220, y:210, w:120, h:20}, {x:50, y:150, w:100, h:20}, {x:600, y:220, w:180, h:280}],
                items: [{x:270, y:340}, {x:450, y:260}, {x:270, y:170}, {x:90, y:110}],
                enemies: [{x:230, y:350, start:220, end:320, vx:1.5}, {x:230, y:180, start:220, end:320, vx:2}],
                door: {x:700, y:170, w:30, h:50}
            },
            4: {
                platforms: [{x:0, y:460, w:800, h:40}, {x:150, y:370, w:500, h:20}, {x:250, y:280, w:300, h:20}, {x:350, y:190, w:100, h:20}],
                items: [{x:200, y:330}, {x:600, y:330}, {x:300, y:240}, {x:500, y:240}, {x:400, y:150}],
                enemies: [{x:200, y:430, start:100, end:700, vx:4}, {x:270, y:340, start:160, end:630, vx:-2}],
                door: {x:730, y:410, w:30, h:50}
            },
            5: {
                platforms: [{x:0, y:460, w:100, h:40}, {x:150, y:380, w:80, h:20}, {x:300, y:300, w:80, h:20}, {x:450, y:220, w:80, h:20}, {x:600, y:150, w:80, h:20}, {x:720, y:230, w:80, h:270}],
                items: [{x:190, y:340}, {x:340, y:260}, {x:490, y:180}, {x:640, y:110}],
                enemies: [{x:150, y:355, start:150, end:210, vx:1}, {x:450, y:195, start:450, end:510, vx:1.5}],
                door: {x:750, y:180, w:30, h:50}
            }
        };

        // Active runtime variables loaded per level
        let platforms = [];
        let items = [];
        let enemies = [];
        let door = {};

        function loadLevel(levelNum) {
            const lvl = levels[levelNum];
            platforms = JSON.parse(JSON.stringify(lvl.platforms));
            items = JSON.parse(JSON.stringify(lvl.items));
            enemies = JSON.parse(JSON.stringify(lvl.enemies));
            door = JSON.parse(JSON.stringify(lvl.door));
            
            // Reset player position
            player.x = 50;
            player.y = 350;
            player.vx = 0;
            player.vy = 0;
            
            document.getElementById("level-display").innerText = `Level: ${currentLevel}/${maxLevels}`;
        }

        // Simple AABB Collision Detection
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.w &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.h &&
                   rect1.y + rect1.height > rect2.y;
        }

        function update() {
            if (gameOver || gameWon) return;

            // Movement Input
            if (keys["KeyA"] || keys["ArrowLeft"]) {
                player.vx = -player.speed;
            } else if (keys["KeyD"] || keys["ArrowRight"]) {
                player.vx = player.speed;
            } else {
                player.vx = 0;
            }

            // Jump Input
            if ((keys["KeyW"] || keys["Space"] || keys["ArrowUp"]) && player.grounded) {
                player.vy = player.jumpForce;
                player.grounded = false;
            }

            // Apply Physical Forces
            player.vy += player.gravity;
            player.x += player.vx;
            player.y += player.vy;

            // Screen Boundary Check
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
            
            // Fall into pit check (if structure allows edge drops)
            if (player.y > canvas.height) {
                handlePlayerDeath();
            }

            // Platform Collisions
            player.grounded = false;
            platforms.forEach(plat => {
                // Check intersect
                if (player.x < plat.x + plat.w &&
                    player.x + player.width > plat.x &&
                    player.y + player.height > plat.y &&
                    player.y + player.height - player.vy <= plat.y + 10) { 
                    
                    // Standing on platform
                    player.grounded = true;
                    player.vy = 0;
                    player.y = plat.y - player.height;
                }
            });

            // Enemy Logic & Behavior
            enemies.forEach(enemy => {
                enemy.x += enemy.vx;
                if (enemy.x <= enemy.start || enemy.x >= enemy.end) {
                    enemy.vx *= -1; // Reverse path direction
                }

                // Hit enemy calculation
                let enemyRect = { x: enemy.x, y: enemy.y, w: 20, h: 20, width: 20, height: 20 };
                if (checkCollision(player, enemyRect)) {
                    handlePlayerDeath();
                }
            });

            // Item Collection Loop
            for (let i = items.length - 1; i >= 0; i--) {
                let itemRect = { x: items[i].x, y: items[i].y, w: 15, h: 15, width: 15, height: 15 };
                if (checkCollision(player, itemRect)) {
                    items.splice(i, 1);
                    score++;
                    document.getElementById("items-display").innerText = `Gems: ${score}`;
                }
            }

            // Exit Goal / Transition collision Check
            if (checkCollision(player, door)) {
                if (currentLevel < maxLevels) {
                    currentLevel++;
                    loadLevel(currentLevel);
                } else {
                    gameWon = true;
                }
            }
        }

        function handlePlayerDeath() {
            lives--;
            document.getElementById("lives-display").innerText = `Lives: ${lives}`;
            if (lives <= 0) {
                gameOver = true;
            } else {
                // Quick respawn coordinate sequence
                player.x = 50;
                player.y = 350;
                player.vx = 0;
                player.vy = 0;
            }
        }

        function render() {
            // Clear Frame Canvas Environment
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameOver) {
                ctx.fillStyle = "#FF5555";
                ctx.font = "40px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
                ctx.font = "20px sans-serif";
                ctx.fillStyle = "#aaa";
                ctx.fillText("Refresh the page to try again.", canvas.width / 2, canvas.height / 2 + 40);
                return;
            }

            if (gameWon) {
                ctx.fillStyle = "#43B581";
                ctx.font = "40px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("VICTORY! ALL LEVELS CLEARED", canvas.width / 2, canvas.height / 2);
                ctx.font = "20px sans-serif";
                ctx.fillStyle = "#aaa";
                ctx.fillText(`Final Gem Count: ${score}`, canvas.width / 2, canvas.height / 2 + 40);
                return;
            }

            // Draw Platforms
            ctx.fillStyle = "#4f545c";
            platforms.forEach(plat => {
                ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                // Draw platform trim top
                ctx.fillStyle = "#7289da";
                ctx.fillRect(plat.x, plat.y, plat.w, 4);
                ctx.fillStyle = "#4f545c";
            });

            // Draw Items (Gems)
            ctx.fillStyle = "#FAA61A";
            items.forEach(item => {
                ctx.beginPath();
                ctx.arc(item.x + 7.5, item.y + 7.5, 7, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Danger Obstacles (Enemies)
            ctx.fillStyle = "#F04747";
            enemies.forEach(enemy => {
                ctx.fillRect(enemy.x, enemy.y, 20, 20);
            });

            // Draw Exit Target Waypoint Portal
            ctx.fillStyle = "#43B581";
            ctx.fillRect(door.x, door.y, door.w, door.h);
            // Handle interior aesthetic detailing
            ctx.fillStyle = "#1e1f22";
            ctx.fillRect(door.x + 5, door.y + 5, door.w - 10, door.h - 5);

            // Render Player Avatar Entity Instance
            ctx.fillStyle = "#5865F2";
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Initialize Global Setup Chain Runtime
        loadLevel(currentLevel);
        gameLoop();
    </script>
</body>
</html>
